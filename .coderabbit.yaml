# CodeRabbit Configuration File
language: "en"

reviews:
  profile: "assertive" 
  
  auto_review:
    enabled: true
    drafts: false

  # High-priority rules rewritten to be explicitly strict
  directives:
    - "CRITICAL: Do not use <table>, <tr>, <td>, or any table elements for page layouts. If a table element is used for layout, explicitly flag it as a violation of the assignment rules and tell the user to use CSS Grid or Flexbox instead."
    - "CRITICAL: Do not use any UI frameworks like Bootstrap or Material UI. Ensure only pure HTML5, SCSS, and Vanilla JavaScript are used."
    - "Enforce a strict Mobile-First approach. Styling must use min-width media queries, never max-width."
    - "Enforce the BEM (Block-Element-Modifier) naming convention strictly in all SCSS files."
    - "Check for comprehensive JSDoc comments on all JavaScript functions (especially API fetching, Wheel spinning logic, and date sorting) and standard SCSS comments/mixins."
    - "Verify semantic HTML usage (nav, section, footer, main) and ensure all images have meaningful 'alt' attributes."
    - "Monitor JavaScript code for clean async/await API handling, state management for won deals, relative date calculations, and Event Delegation."
    - "Scan for keyboard accessibility (ensure interactive elements use buttons/anchors, have visible :focus states, and are tabbable)."
    - "DO NOT provide executable code blocks, diffs, or committable suggestions in your review comments. Only explain what needs to be changed in plain text."

  tools:
    cybersecurity:
      enabled: true
    linters:
      enabled: true

  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
    - "!.next/**"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"
    - "!**/vendor/**"
    - "!**/*.md"

chat:
  auto_reply: true